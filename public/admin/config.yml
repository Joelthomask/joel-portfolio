backend:
  name: turbo-github
  branch: main
  turbo_site_id: ad253167-7063-4ada-8ec7-ed583fe6aa40

# Creates review branches and pull requests instead of changing the live branch directly.
publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: Home / Hero
    files:
      - name: hero
        label: Hero & Social Links
        file: src/content/site.json
        format: json
        fields:
          - { label: Greeting, name: greeting, widget: string }
          - { label: Name, name: name, widget: string }
          - { label: Role, name: role, widget: string }
          - { label: Introduction, name: description, widget: text }
          - { label: GitHub URL, name: github, widget: string }
          - { label: LinkedIn URL, name: linkedin, widget: string }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: [sortOrder, title]
    fields:
      - { label: Project Title, name: title, widget: string, required: true }
      - { label: Category / eyebrow, name: category, widget: string, required: true }
      - label: Project Lab Category
        name: projectType
        widget: select
        options: ["Web Apps", "AI / ML", "Desktop Apps", "Databases", "Others"]
        default: "Others"
      - { label: Description, name: description, widget: text }
      - label: Technologies / Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
      - { label: Project Image, name: image, widget: image, required: false }
      - { label: Show in Featured Work, name: featured, widget: boolean, default: true }
      - { label: Display Order, name: sortOrder, widget: number, value_type: int, default: 99, required: true }

  - name: about
    label: About
    files:
      - name: about
        label: About Section
        file: src/content/about.json
        format: json
        fields:
          - { label: First Heading Line, name: headingLineOne, widget: string }
          - { label: Second Heading Line, name: headingLineTwo, widget: string }
          - { label: Biography, name: paragraphOne, widget: text }
          - { label: Additional Paragraph, name: paragraphTwo, widget: text }
          - { label: Portrait Image, name: portrait, widget: image }

  - name: toolkit
    label: My Toolkit
    files:
      - name: toolkit
        label: Technologies
        file: src/content/toolkit.json
        format: json
        fields:
          - label: Technologies
            name: technologies
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Technology Name, name: name, widget: string }
              - { label: Symbol, name: symbol, widget: string }
              - { label: Description, name: detail, widget: string }

  - name: contact
    label: Contact
    files:
      - name: contact
        label: Contact Section
        file: src/content/contact.json
        format: json
        fields:
          - { label: First Heading Line, name: headingLineOne, widget: string }
          - { label: Second Heading Line, name: headingLineTwo, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: WhatsApp URL, name: whatsapp, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Location, name: location, widget: string }
